name: conformance

# Runs the PMO as Code conformance suite (from the spec repo, at the spec tag
# this implementation claims) against the working tree on every change.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: c4g-john/pmo-as-code-spec
          ref: v0.8.0
          path: spec
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install this docassert
        run: pip install -e .
      - name: Run the conformance suite
        run: |
          python3 spec/conformance/runner.py --adapter \
            "docassert {cmd} --documents-dir {docs} [report]--json {out}[/report]"
