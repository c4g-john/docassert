name: bridge reconcile (PRJ-002-ENG)

# Polices this repo's issues against the documented scope of its project.
# A red run is the alarm.
on:
  workflow_run:
    workflows: ["bridge scaffold (PRJ-002-ENG)"]
    types: [completed]
  issues:
    types: [opened, reopened, edited, closed]
  repository_dispatch:
    types: [bridge-reconcile]
  workflow_dispatch:

concurrency:
  group: bridge-reconcile
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    if: ((github.event_name != 'issues' || github.actor != 'github-actions[bot]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: c4g-john/pmo-as-code-pmo
          path: pmo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: c4g-john/docassert-action/install@v1
        with:
          version-file: pmo/.docassert-version
      - name: Reconcile against documented scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docassert bridge reconcile \
            --documents-dir pmo/documents \
            --project PRJ-002-ENG \
            --repo "$GITHUB_REPOSITORY"
