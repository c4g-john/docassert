name: quality

# Lints, type-checks, and runs docassert's own unit tests (with a coverage
# floor) on every PR and push, across every Python version the package claims
# to support — plus a Windows leg.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install docassert with dev tools
        run: pip install -e ".[dev,convert]"   # convert = python-docx/pypdf, exercises `extract`
      - name: README spec version matches the conformance pin
        # The README's "implements the specification vX.Y" claim is public
        # (PyPI front page); it must track the tag conformance.yml pins.
        run: |
          pin=$(grep -oE 'ref: v[0-9]+\.[0-9]+' .github/workflows/conformance.yml | head -n1 | sed 's/ref: v//')
          claim=$(grep -oE 'specification\]\(https[^)]*\) \*\*v[0-9]+\.[0-9]+' README.md | grep -oE 'v[0-9]+\.[0-9]+' | sed 's/v//')
          echo "README claims v$claim; conformance pins v$pin"
          [ "$claim" = "$pin" ] || { echo "::error::README spec version (v$claim) drifted from the conformance pin (v$pin)"; exit 1; }

      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (types)
        run: mypy --config-file pyproject.toml
      - name: Pytest (unit tests + coverage floor)
        run: pytest -q --cov=docassert

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # console output uses ✓/✗; keep Windows stdout UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install docassert with dev tools
        run: pip install -e ".[dev,convert]"
      - name: Pytest (unit tests)
        run: pytest -q

  # Stable aggregate for branch protection: require "lint-and-test" and it
  # holds whatever the matrix grows to.
  lint-and-test:
    runs-on: ubuntu-latest
    needs: [test, windows]   # conformance gates separately (own workflow)
    steps:
      - run: echo "all legs passed"

  stability-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: STABILITY.md CLI reference matches the live parser
        run: |
          python scripts/dump_cli_surface.py > /tmp/surface.md
          awk '/^### `docassert /,0' STABILITY.md > /tmp/documented.md
          if ! diff -u /tmp/documented.md /tmp/surface.md; then
            echo "::error::STABILITY.md CLI reference drifted — regenerate: python scripts/dump_cli_surface.py"
            exit 1
          fi
