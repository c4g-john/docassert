name: quality

# Lints, type-checks, and runs docassert's own unit tests (with a coverage
# floor) on every PR and push, across every Python version the package claims
# to support — plus a Windows leg.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install docassert with dev tools
        run: pip install -e ".[dev,convert]"   # convert = python-docx/pypdf, exercises `extract`
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (types)
        run: mypy --config-file pyproject.toml
      - name: Pytest (unit tests + coverage floor)
        run: pytest -q --cov=docassert

  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # console output uses ✓/✗; keep Windows stdout UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docassert with dev tools
        run: pip install -e ".[dev,convert]"
      - name: Pytest (unit tests)
        run: pytest -q

  # Stable aggregate for branch protection: require "lint-and-test" and it
  # holds whatever the matrix grows to.
  lint-and-test:
    runs-on: ubuntu-latest
    needs: [test, windows]
    steps:
      - run: echo "all legs passed"
