[project]
name = "docassert"
dynamic = ["version"]
description = "Unit testing for business documents — validate structured Markdown docs against a configurable audit standard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "C4G Enterprises Inc." }]
keywords = ["pmo", "documentation", "validation", "governance", "markdown", "audit", "traceability", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
convert = ["python-docx>=1.1", "pypdf>=4.0"]   # source extraction for doc-to-pmo
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://docassert.com"
Repository = "https://github.com/c4g-john/docassert"
Issues = "https://github.com/c4g-john/docassert/issues"

[project.scripts]
docassert = "docassert.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docassert*"]   # auto-discover subpackages (docassert, docassert.status, …)

[tool.setuptools.package-data]
# Ship the default criteria/schema/profiles/templates/consistency.yaml so
# docassert works in a repo that hasn't defined its own (and `docassert init`
# can scaffold them).
docassert = ["_data/**/*"]

[tool.setuptools.dynamic]
version = { attr = "docassert.__version__" }

[tool.pytest.ini_options]
# Import docassert from the repo root without relying on an editable install
# (avoids editable-install quirks on newer Python versions).
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# Long lines are common in the descriptive check messages and sample content.
ignore = ["E501"]

[tool.mypy]
files = ["docassert"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["frontmatter", "docx", "pypdf", "yaml", "jsonschema", "anthropic"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["docassert"]

[tool.coverage.report]
# Keep the gate honest: fail CI if coverage drops below the floor.
fail_under = 85
